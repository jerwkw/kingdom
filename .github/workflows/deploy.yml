name: Deploy

# Reusable: builds the web app for one Firebase alias and runs tool/deploy.sh.
# Credentials come from Workload Identity Federation via the repository variables
# STAGING_/PROD_GCP_WIF_PROVIDER and STAGING_/PROD_GCP_DEPLOY_SERVICE_ACCOUNT.
# Each provider's attribute condition decides which workflow runs it trusts.
on:
  workflow_call:
    inputs:
      alias:
        description: Firebase alias from .firebaserc (staging or prod)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.alias == 'prod' && vars.PROD_GCP_WIF_PROVIDER || vars.STAGING_GCP_WIF_PROVIDER }}
          service_account: ${{ inputs.alias == 'prod' && vars.PROD_GCP_DEPLOY_SERVICE_ACCOUNT || vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: flutter pub get
      - name: Build web
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          if [ "$ALIAS" = staging ]; then
            flutter build web --dart-define=FIREBASE_ENV=staging
          else
            flutter build web
          fi
      - run: tool/deploy.sh "${{ inputs.alias }}"
