name: CI

# Steps live in tool/check.sh so local runs match. Pull requests run this
# directly; pushes to main and release tags run it via deploy-staging.yml /
# deploy-prod.yml before deploying.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: tool/check.sh flutter

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Firestore/Auth emulators need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: tool/check.sh functions
        working-directory: .
